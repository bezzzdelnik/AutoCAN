; AutoCAN — dual TWAI logger for ESP32-C6 + SN65HVD230
; Arduino-ESP32 3.x: https://github.com/espressif/arduino-esp32

[platformio]
default_envs = esp32-c6
description = Dual-channel automotive CAN logger (ESP32-C6)

[env:esp32-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 921600
monitor_port = COM6
monitor_filters = direct
upload_port = COM6
upload_speed = 921600

; Serial = HWCDC → native USB Serial/JTAG (COM6, VID 303A). Драйвер Windows inbox.
; CH343 (COM5) для лога не нужен.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DSERIAL_BAUD=921600
    -DCAN0_TX_GPIO=4
    -DCAN0_RX_GPIO=5
    -DCAN1_TX_GPIO=6
    -DCAN1_RX_GPIO=7
    -DCAN0_BITRATE=500000
    -DCAN1_BITRATE=500000
    -DCAN_LISTEN_ONLY=1
